# Shared by PS1/BAT/SH. CLI flags and plugin IDs follow upstream dsh headless.
- id: system-prompt
  config:
    personaPrefix: You are a mahjong player. Follow the supplied game task and use only the mahjong MCP tools.

- id: agent-default-model
  config:
    provider: !!js process.env.MAHJONG_DSH_PROVIDER || 'deepseek-official'
    model: !!js process.env.MAHJONG_DSH_MODEL || 'deepseek-flash'
    reasoningEffort: !!js process.env.MAHJONG_DSH_EFFORT || 'low'

- id: tools
  config:
    mode: native

# No interactive approval channel in headless; built-in action tools are disabled below.
- id: approval
  config:
    policy: never
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.env.MAHJONG_TASK_DIR

# Keep one-shot session data inside the directory cleaned up by the game.
- id: session-persistence-jsonl
  config:
    root: !!js process.env.MAHJONG_TASK_DIR + '/dsh-sessions'
- id: storage-json
  config:
    root: !!js process.env.MAHJONG_TASK_DIR + '/dsh-storages'

- id: session-title-llm
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  disabled: true
- id: plan-mode
  disabled: true
- id: goal-round-driver
  disabled: true
- id: tool-plugin-manager
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-web
  disabled: true
- id: mcp-resources
  disabled: true

- insert:
    - id: mahjong-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: mahjong
        transport: stdio
        command: !!js JSON.parse(process.env.MAHJONG_DSH_MCP).command
        args: !!js JSON.parse(process.env.MAHJONG_DSH_MCP).args
        env: !!js JSON.parse(process.env.MAHJONG_DSH_MCP).env
        failOnStartupError: true
        reconnect:
          enabled: false
